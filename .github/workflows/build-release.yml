name: Build queued Afterspace release
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: afterspace-release-builder
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Read authenticated Firebase upload request
        id: request
        run: |
          if (-not $env:FIREBASE_RELEASE_BUILDER_PASSWORD) {
            throw 'FIREBASE_RELEASE_BUILDER_PASSWORD is not configured.'
          }
          $authBody = @{
            email = 'afterspace-release-builder@networkunity.local'
            password = $env:FIREBASE_RELEASE_BUILDER_PASSWORD
            returnSecureToken = $true
          } | ConvertTo-Json -Compress
          $auth = Invoke-RestMethod `
            -Method Post `
            -Uri 'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=AIzaSyB6adKgbFuYP5ekrLUUJSshjZ0NuS7OPwg' `
            -ContentType 'application/json' `
            -Body $authBody
          if (-not $auth.idToken) { throw 'Firebase build authentication failed.' }
          Write-Output "::add-mask::$($auth.idToken)"
          "FIREBASE_ID_TOKEN=$($auth.idToken)" >> $env:GITHUB_ENV
          $encodedToken = [Uri]::EscapeDataString([string]$auth.idToken)
          $requestUri = "https://as-superchat-default-rtdb.firebaseio.com/releaseBuildRequest.json?auth=$encodedToken"
          $request = Invoke-RestMethod -Uri $requestUri
          if (-not $request -or $request.error) {
            'no_request=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ([string]$request.version -notmatch '^\d+(\.\d+){1,3}$') { throw 'Invalid requested version.' }
          "BUILD_VERSION=$($request.version)" >> $env:GITHUB_ENV
          if ($request.storage -eq 'rtdb-gzip-chunks' -and $request.payloadPath -match '^[A-Za-z0-9_/-]+$') {
            "HTML_STORAGE=rtdb-gzip-chunks" >> $env:GITHUB_ENV
            "HTML_PAYLOAD_PATH=$($request.payloadPath)" >> $env:GITHUB_ENV
          } elseif ([string]$request.url -match '^https://firebasestorage\.googleapis\.com/') {
            "HTML_STORAGE=url" >> $env:GITHUB_ENV
            "HTML_URL<<AFTERSPACE_URL" >> $env:GITHUB_ENV
            [string]$request.url >> $env:GITHUB_ENV
            "AFTERSPACE_URL" >> $env:GITHUB_ENV
          } else {
            throw 'Build request does not contain a trusted HTML source.'
          }
          "EXPECTED_HTML_HASH=$($request.sha256)" >> $env:GITHUB_ENV
          $notes = if ($request.notes) { [string]$request.notes } else { 'Afterspace app update.' }
          Set-Content -LiteralPath release-notes.txt -Value $notes -Encoding UTF8
          gh release view "v$($request.version)" --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            'already_exists=true' >> $env:GITHUB_OUTPUT
          }
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_RELEASE_BUILDER_PASSWORD: ${{ secrets.FIREBASE_RELEASE_BUILDER_PASSWORD }}
      - uses: actions/setup-node@v5
        if: steps.request.outputs.already_exists != 'true' && steps.request.outputs.no_request != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Download and validate uploaded HTML
        if: steps.request.outputs.already_exists != 'true' && steps.request.outputs.no_request != 'true'
        run: |
          $destination = 'desktop/app/Afterspace V10.html'
          if ($env:HTML_STORAGE -eq 'rtdb-gzip-chunks') {
            $payloadUrl = "https://as-superchat-default-rtdb.firebaseio.com/$($env:HTML_PAYLOAD_PATH).json"
            if (-not $env:FIREBASE_ID_TOKEN) { throw 'Firebase build token is unavailable.' }
            $encodedToken = [Uri]::EscapeDataString([string]$env:FIREBASE_ID_TOKEN)
            $payload = Invoke-RestMethod -Uri "$payloadUrl?auth=$encodedToken"
            if (-not $payload -or -not $payload.chunks) { throw 'Realtime Database HTML payload is missing.' }
            if ($payload.chunks -is [array]) {
              $parts = @($payload.chunks | Where-Object { $_ -is [string] })
            } else {
              $parts = @($payload.chunks.PSObject.Properties | Sort-Object { [int]$_.Name } | ForEach-Object Value)
            }
            $packed = [Convert]::FromBase64String(($parts -join ''))
            if ($payload.encoding -eq 'gzip-base64') {
              $input = [IO.MemoryStream]::new($packed)
              $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
              $output = [IO.File]::Create($destination)
              try { $gzip.CopyTo($output) } finally { $output.Dispose(); $gzip.Dispose(); $input.Dispose() }
            } elseif ($payload.encoding -eq 'base64') {
              [IO.File]::WriteAllBytes($destination, $packed)
            } else {
              throw 'Unsupported Realtime Database payload encoding.'
            }
          } else {
            Invoke-WebRequest -Uri $env:HTML_URL -OutFile $destination
          }
          $html = Get-Content -Raw -LiteralPath $destination
          if ($html -notmatch '<!doctype html' -or $html -notmatch 'Afterspace') { throw 'Uploaded file is not valid Afterspace HTML.' }
          if ($env:EXPECTED_HTML_HASH -match '^[A-Fa-f0-9]{64}$') {
            $actual = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
            if ($actual -ne $env:EXPECTED_HTML_HASH) { throw 'Uploaded HTML hash does not match.' }
          }
      - name: Build portable Windows EXE
        if: steps.request.outputs.already_exists != 'true' && steps.request.outputs.no_request != 'true'
        working-directory: desktop
        run: |
          npm ci
          npm version $env:BUILD_VERSION --no-git-tag-version --allow-same-version
          npm run build:win
          $info = (Get-Item -LiteralPath 'dist/Afterspace.exe').VersionInfo
          if ($info.ProductName -notlike 'Afterspace*' -or $info.ProductVersion -notlike "$env:BUILD_VERSION*") { throw 'Built EXE metadata is invalid.' }
      - name: Publish single-file release
        if: steps.request.outputs.already_exists != 'true' && steps.request.outputs.no_request != 'true'
        run: gh release create "v$env:BUILD_VERSION" 'desktop/dist/Afterspace.exe' --repo $env:GITHUB_REPOSITORY --title "Afterspace $env:BUILD_VERSION" --notes-file release-notes.txt --latest
        env:
          GH_TOKEN: ${{ github.token }}
