<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Afterspace Publisher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} :root{color-scheme:dark;--line:#2b2b2b;--muted:#999}
    body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:'Special Elite',cursive;display:grid;place-items:center;padding:28px}
    main{width:min(620px,100%);border:1px solid var(--line);border-radius:18px;background:#0b0b0b;box-shadow:0 30px 100px #000;padding:32px}
    header{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}
    .mark{width:52px;height:52px;border:1px solid #444;border-radius:50%;display:grid;place-items:center;font-size:22px}
    h1{font-size:24px;margin:0 0 5px}.sub,.hint{color:var(--muted);line-height:1.6}.sub{font-size:13px;margin:0}
    label{display:block;font-size:12px;letter-spacing:.08em;margin:17px 0 7px;color:#bbb}
    input,textarea,button{font:inherit} input,textarea{width:100%;background:#050505;color:#fff;border:1px solid #333;border-radius:9px;padding:12px}
    textarea{min-height:82px;resize:vertical} input:focus,textarea:focus{outline:1px solid #fff}
    input[type=file]{padding:22px;border-style:dashed}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    button{width:100%;margin-top:20px;padding:13px;border-radius:9px;border:1px solid #fff;background:#fff;color:#000;cursor:pointer}
    button.google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#171717}
    button.google svg{width:20px;height:20px}.divider{display:flex;align-items:center;gap:12px;color:#777;font-size:12px;margin:19px 0 2px}.divider::before,.divider::after{content:'';height:1px;flex:1;background:#292929}
    button.secondary{background:#090909;color:#fff;border-color:#333}button:disabled{opacity:.45;cursor:not-allowed}
    #publisher{display:none}.status{margin-top:18px;padding:13px;border-left:3px solid #777;background:#111;color:#bbb;white-space:pre-wrap;line-height:1.55}
    .ok{border-color:#72ffb1;color:#72ffb1}.error{border-color:#ff6767;color:#ff8a8a}.hint{font-size:12px;margin:14px 0 0}
    @media(max-width:560px){main{padding:22px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <header><div class="mark">AS</div><div><h1>Afterspace Publisher</h1><p class="sub">Upload HTML. GitHub builds and releases the Windows EXE.</p></div></header>
  <section id="login">
    <button id="googleSignIn" class="google" type="button" aria-label="Continue with Google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"/><path fill="#34a853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1a5.8 5.8 0 0 1-5.5-4H3.2v2.6A10 10 0 0 0 12 22z"/><path fill="#fbbc05" d="M6.5 14.1A6 6 0 0 1 6.2 12c0-.7.1-1.4.3-2.1V7.3H3.2A10 10 0 0 0 2 12c0 1.7.4 3.3 1.2 4.7l3.3-2.6z"/><path fill="#ea4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 12 2a10 10 0 0 0-8.8 5.3l3.3 2.6a5.8 5.8 0 0 1 5.5-4z"/></svg>
      Continue with Google
    </button>
    <div class="divider">OR USE EMAIL</div>
    <label for="email">Firebase admin email</label><input id="email" type="email" autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
    <button id="signIn">Sign in</button>
  </section>
  <section id="publisher">
    <div class="row"><div><label for="version">App version</label><input id="version" placeholder="8.0.2" pattern="\d+(\.\d+){1,3}"></div><div><label>Signed in</label><button id="signOut" class="secondary" type="button">Sign out</button></div></div>
    <label for="htmlFile">Afterspace HTML file</label><input id="htmlFile" type="file" accept=".html,text/html">
    <label for="notes">Release notes</label><textarea id="notes" placeholder="What changed in this release?"></textarea>
    <button id="publish" disabled>Upload and build EXE</button>
    <p class="hint">The HTML update is published immediately. GitHub checks the build queue every five minutes, creates the portable EXE, and makes it the latest single-file release.</p>
  </section>
  <div id="status" class="status">Ready.</div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {getDatabase,ref as databaseRef,set} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const config={apiKey:'AIzaSyB6adKgbFuYP5ekrLUUJSshjZ0NuS7OPwg',authDomain:'as-superchat.firebaseapp.com',databaseURL:'https://as-superchat-default-rtdb.firebaseio.com',projectId:'as-superchat',storageBucket:'as-superchat.firebasestorage.app',messagingSenderId:'142659193054',appId:'1:142659193054:web:a3f34f8ded3a8e99c49a4f'};
const firebaseApp=initializeApp(config),auth=getAuth(firebaseApp),database=getDatabase(firebaseApp);
const googleProvider=new GoogleAuthProvider();googleProvider.setCustomParameters({prompt:'select_account'});
const byId=id=>document.getElementById(id),status=byId('status');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function uploadHtml(file,path){const user=auth.currentUser;if(!user)throw new Error('Sign in before publishing.');const idToken=await user.getIdToken(true),downloadToken=crypto.randomUUID(),boundary=`afterspace_${crypto.randomUUID().replaceAll('-','')}`,metadata=JSON.stringify({name:path,contentType:'text/html',metadata:{firebaseStorageDownloadTokens:downloadToken}}),body=new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n--${boundary}\r\nContent-Type: text/html\r\n\r\n`,file,`\r\n--${boundary}--`]);let lastError;for(let attempt=1;attempt<=4;attempt++){setStatus(`Uploading HTML (attempt ${attempt}/4)…`);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),180000);try{const response=await fetch(`https://firebasestorage.googleapis.com/v0/b/as-superchat.firebasestorage.app/o?uploadType=multipart`,{method:'POST',headers:{Authorization:`Bearer ${idToken}`,'Content-Type':`multipart/related; boundary=${boundary}`},body,signal:controller.signal}),payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload?.error?.message||`Storage returned HTTP ${response.status}`);return`https://firebasestorage.googleapis.com/v0/b/as-superchat.firebasestorage.app/o/${encodeURIComponent(path)}?alt=media&token=${encodeURIComponent(payload.downloadTokens||downloadToken)}`}catch(error){lastError=error;if(attempt<4)await wait(1200*2**(attempt-1))}finally{clearTimeout(timer)}}throw lastError||new Error('Upload failed after four attempts.')}
function setStatus(message,type=''){status.textContent=message;status.className=`status ${type}`}
function bytesToBase64(bytes){let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(binary)}
async function encodeHtml(text){const input=new TextEncoder().encode(text);if(typeof CompressionStream!=='function')return{encoding:'base64',bytes:input,originalSize:input.length};const stream=new Blob([input]).stream().pipeThrough(new CompressionStream('gzip'));return{encoding:'gzip-base64',bytes:new Uint8Array(await new Response(stream).arrayBuffer()),originalSize:input.length}}
async function uploadHtmlToDatabase(text,sha256,version,onProgress=()=>{}){if(!auth.currentUser)throw new Error('Sign in before publishing.');onProgress('Compressing HTML...');const encoded=await encodeHtml(text),base64=bytesToBase64(encoded.bytes),chunkSize=240000,chunks={};for(let offset=0,index=0;offset<base64.length;offset+=chunkSize,index++)chunks[index]=base64.slice(offset,offset+chunkSize);onProgress(`Saving ${Object.keys(chunks).length} compressed chunks...`);const payloadPath='appUpdatePayload/current';await set(databaseRef(database,payloadPath),{version,encoding:encoded.encoding,chunks,originalSize:encoded.originalSize,compressedSize:encoded.bytes.length,sha256,timestamp:Date.now()});return payloadPath}
function valid(){const file=byId('htmlFile').files[0];byId('publish').disabled=!(file&&/^\d+(\.\d+){1,3}$/.test(byId('version').value.trim()))}
byId('version').addEventListener('input',valid);byId('htmlFile').addEventListener('change',valid);
byId('googleSignIn').addEventListener('click',async()=>{try{setStatus('Opening Google sign-in…');await signInWithPopup(auth,googleProvider);setStatus('Signed in with Google.','ok')}catch(error){const message=error.code==='auth/unauthorized-domain'?'This GitHub Pages domain must be added to Firebase Authentication → Settings → Authorized domains.':error.code==='auth/popup-closed-by-user'?'Google sign-in was closed before it finished.':error.message;setStatus(message,'error')}});
byId('signIn').addEventListener('click',async()=>{try{setStatus('Signing in…');await signInWithEmailAndPassword(auth,byId('email').value.trim(),byId('password').value);setStatus('Signed in.','ok')}catch(error){setStatus(error.message,'error')}});
byId('password').addEventListener('keydown',event=>{if(event.key==='Enter')byId('signIn').click()});
byId('signOut').addEventListener('click',()=>signOut(auth));
onAuthStateChanged(auth,user=>{byId('login').style.display=user?'none':'block';byId('publisher').style.display=user?'block':'none';if(!user)setStatus('Sign in with an authorized Firebase account.')});
byId('publish').addEventListener('click',async()=>{
  const user=auth.currentUser,file=byId('htmlFile').files[0],version=byId('version').value.trim(),notes=byId('notes').value.trim();
  if(!user||!file||!/^\d+(\.\d+){1,3}$/.test(version))return setStatus('Choose an HTML file and enter a valid version.','error');
  const text=await file.text();if(!/<!doctype html/i.test(text)||!/Afterspace/i.test(text))return setStatus('That does not look like a valid Afterspace HTML file.','error');
  byId('publish').disabled=true;
  try{
    setStatus('Computing SHA-256 and uploading HTML…');
    const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    const hash=[...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,'0')).join('');
    const payloadPath=await uploadHtmlToDatabase(text,hash,version,message=>setStatus(message)),timestamp=Date.now();
    const update={version,storage:'rtdb-gzip-chunks',payloadPath,sha256:hash,notes:notes||null,timestamp};
    await set(databaseRef(database,'htmlUpdate'),update);
    await set(databaseRef(database,'releaseBuildRequest'),{...update,requestedBy:user.email});
    setStatus(`Queued Afterspace ${version}.\nHTML users update immediately; the GitHub EXE release should appear within about five minutes.`,'ok');
  }catch(error){setStatus(`Publish failed: ${error.message}`,'error');byId('publish').disabled=false}
});
</script>
</body>
</html>
